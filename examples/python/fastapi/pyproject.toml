[project]
name = "topdown-fastapi-example"
version = "0.1.0"
description = "FastAPIとSQLAlchemyで入口から同じ粒度の段を下りる実例"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
