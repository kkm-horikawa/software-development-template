name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/topdown/go.mod
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./scripts/check-all.sh
